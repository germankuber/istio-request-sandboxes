apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.sandbox.poc
spec:
  group: sandbox.poc
  scope: Namespaced
  names:
    plural: sandboxes
    singular: sandbox
    kind: Sandbox
    listKind: SandboxList
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      env:
                        type: array
                        items:
                          type: object
                          required: [name, value]
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                mocks:
                  type: array
                  items:
                    type: object
                    required: [host, method, path, status]
                    properties:
                      host:
                        type: string
                      method:
                        type: string
                      path:
                        type: string
                      status:
                        type: integer
                      body:
                        x-kubernetes-preserve-unknown-fields: true
                      enabled:
                        type: boolean
                        default: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                message:
                  type: string
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ready:
                        type: boolean
