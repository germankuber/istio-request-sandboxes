apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-weather
  namespace: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-weather
  template:
    metadata:
      labels:
        app: external-weather
    spec:
      containers:
        - name: external-weather
          image: external-weather:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: external-weather
  namespace: external
spec:
  selector:
    app: external-weather
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: external-weather-upstream
  namespace: external
spec:
  selector:
    app: external-weather
  ports:
    - name: http
      port: 80
      targetPort: 8000
