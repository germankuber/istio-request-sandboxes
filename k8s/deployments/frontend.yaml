apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: baseline
  template:
    metadata:
      labels:
        app: frontend
        version: baseline
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
