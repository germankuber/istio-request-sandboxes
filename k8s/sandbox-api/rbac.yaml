apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-api
rules:
  - apiGroups: ["sandbox.poc"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-api
subjects:
  - kind: ServiceAccount
    name: sandbox-api
    namespace: default
roleRef:
  kind: Role
  name: sandbox-api
  apiGroup: rbac.authorization.k8s.io
